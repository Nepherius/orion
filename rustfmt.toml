edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true

# `spaces_around_ranges` is an unstable rustfmt option and requires nightly.
# Removing it so formatting works on stable toolchains (CI and local builds).
