stages:
  - lint
  - build
  - release

variables:
  RUST_VERSION: "latest"
  NODE_VERSION: "20"

# Lint TypeScript and JavaScript
lint:typescript:
  stage: lint
  image: node:20
  script:
    - npm install
    - npm run lint:react
    - npm run format:react:check
  allow_failure: false

# Lint Rust
lint:rust:
  stage: lint
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
  script:
    - cd src-tauri
    - rustup component add clippy
    - cargo clippy -- -D warnings
    - rustup component add rustfmt
    - cargo fmt -- --check
  allow_failure: false

# Build for Linux
build:linux:
  stage: build
  image: node:20-bookworm
  before_script:
    - apt-get update
    - apt-get install -y build-essential libssl-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
  script:
    - npm install
    - npm run tauri:build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/
    expire_in: 30 days
  only:
    - tags
  cache:
    paths:
      - node_modules/
      - src-tauri/target/
      - $HOME/.cargo/

build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  timeout: 2h
  variables:
    NODE_VERSION: "22.14.0"
  before_script:
    - $ErrorActionPreference = "Stop"

    # Install Chocolatey if it is not already available
    - |
      if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
      }

    # Install Visual Studio Build Tools / MSVC toolchain
    - choco install visualstudio2022buildtools -y --no-progress --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --norestart"

    # Remove unsupported Node versions, such as Node 21
    - choco uninstall nodejs -y --no-progress
    - choco uninstall nodejs.install -y --no-progress

    # Install supported Node.js version for Vite 8
    - choco install nodejs --version=$env:NODE_VERSION -y --no-progress

    # Manually expose Node/npm to this PowerShell session instead of using refreshenv
    - $env:PATH = "C:\Program Files\nodejs;$env:APPDATA\npm;$env:PATH"
    - node -v
    - npm -v

    # Install Rust if missing
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
    - |
      if (!(Get-Command rustc -ErrorAction SilentlyContinue)) {
        Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
        .\rustup-init.exe -y --default-host x86_64-pc-windows-msvc --default-toolchain stable
        $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
      }

    # Ensure stable Rust is selected
    - rustup default stable
    - rustc -V
    - cargo -V

  script:
    - npm ci
    - npm run tauri:build:windows

  artifacts:
    paths:
      - src-tauri/target/release/bundle/
    expire_in: 30 days

  only:
    - tags

  cache:
    key: windows-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - src-tauri/target/

publish:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Running Release generation for tag $CI_COMMIT_TAG"
  dependencies:
    - build:windows
    - build:linux
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automated release including Windows and Linux binaries.'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Orion Windows Binary'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build:windows'
        - name: 'Orion Linux Binary'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build:linux'