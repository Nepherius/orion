stages:
  - lint
  - build
  - release

variables:
  RUST_VERSION: "latest"
  NODE_VERSION: "20"

# Lint TypeScript and JavaScript
lint:typescript:
  stage: lint
  image: node:20
  script:
    - npm install
    - npm run lint
    - npm run format:check
  allow_failure: false

# Lint Rust
lint:rust:
  stage: lint
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
  script:
    - cd src-tauri
    - rustup component add clippy
    - cargo clippy -- -D warnings
    - rustup component add rustfmt
    - cargo fmt -- --check
  allow_failure: false

# Build for Linux
build:linux:
  stage: build
  image: node:20-bookworm
  before_script:
    - apt-get update
    - apt-get install -y build-essential libssl-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
  script:
    - npm install
    - npm run tauri:build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/
    expire_in: 30 days
  only:
    - tags
  cache:
    paths:
      - node_modules/
      - src-tauri/target/
      - $HOME/.cargo/

# Build for Windows (when tagged)
build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  variables:
    ErrorActionPreference: STOP
  before_script:
    - Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
    - choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --norestart" -y
    - choco install nodejs -y
    - Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-host x86_64-pc-windows-msvc --default-toolchain stable
    - $env:PATH += ";$env:USERPROFILE\.cargo\bin"
    - rustc -V
    - node -v
  script:
    - npm install
    - npm run tauri:build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/
    expire_in: 30 days
  only:
    - tags
  cache:
    paths:
      - node_modules/
      - src-tauri/target/

# Publish Release (when tagged)
publish:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Running Release generation for tag $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automated release including Windows and Linux binaries.'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
  dependencies:
    - build:windows
    - build:linux
